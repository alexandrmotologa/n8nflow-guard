version: 2
project_name: n8nflow-guard

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/n8nflow-guard
    binary: n8nflow-guard
    ldflags:
      - -s -w
      - -X github.com/alexandrmotologa/n8nflow-guard/internal/cli.Version={{.Version}}
      - -X github.com/alexandrmotologa/n8nflow-guard/internal/cli.GitCommit={{.Commit}}
      - -X github.com/alexandrmotologa/n8nflow-guard/internal/cli.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
