name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.27']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build binary
        run: go build -v ./cmd/n8nflow-guard

      - name: Run unit tests with race detection
        run: go test -v -race "-coverprofile=coverage.txt" "-covermode=atomic" ./...

      - name: Verify self-lint against clean fixture
        run: go run ./cmd/n8nflow-guard lint ./testdata/clean_workflow.json
